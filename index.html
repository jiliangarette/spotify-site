<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Now Spinning</title>
<meta name="description" content="The album cover of what is playing on Spotify, spinning as a CD on black.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Now Spinning">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="/styles.css">
<script src="/app.js" defer></script>
</head>
<body data-state="boot">
<main class="room">
  <div class="disc" id="disc" role="img" aria-label="Nothing playing">
    <div class="spin" id="spin"><div class="art"><img id="artA" alt=""><img id="artB" alt=""></div></div>
    <div class="grooves"></div>
    <div class="glint"></div>
    <div class="sheen"></div>
    <div class="hub"></div>
    <div class="rim"></div>
  </div>
</main>

<section class="panel" id="connect" hidden>
  <button type="button" class="spotify" id="connectBtn">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/></svg>
    Connect with Spotify
  </button>
</section>

<p class="note" id="note" role="status"></p>

<nav class="controls" id="controls" aria-label="Display controls" hidden>
  <button type="button" class="txt" id="discBtn">Picture</button>
  <button type="button" class="txt" id="srcBtn">Album</button>
  <button type="button" id="fsBtn" aria-label="Fullscreen">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 9V4.5H9M19.5 9V4.5H15M4.5 15v4.5H9M19.5 15v4.5H15"/></svg>
  </button>
  <button type="button" id="signOut" aria-label="Disconnect Spotify">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4.5h4.5v15H14M10 8l-4 4 4 4M6 12h9"/></svg>
  </button>
</nav>
</body>
</html>
